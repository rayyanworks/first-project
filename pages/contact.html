<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact-info</title>
    <link rel="stylesheet" href="../styles/contact.css">
</head>

<body>
    <section class="contact-section">
        <div class="contact-left">
            <h1>GET IN<br>TOUCH</h1>

            <p>
                For general enquiries, training and booking
                enquiries, please feel free to reach out.
            </p>

            <p>
                If you wish to make an appointment,
                you can book directly through our booking system.
            </p>

            <div class="contact-info">
                <p><strong>Tel:</strong> +021 011 9325</p>
                <p><strong>E-mail:</strong> info@example.com</p>
            </div>
        </div>

        <div class="contact-right">
            <form>

                <div class="row">
                    <div class="field">
                        <label>First Name</label>
                        <input type="text" required>
                    </div>

                    <div class="field">
                        <label>Last Name</label>
                        <input type="text" required>
                    </div>
                </div>

                <div class="field">
                    <label>Email</label>
                    <input type="email" required>
                </div>

                <div class="field">
                    <label>Phone</label>
                    <input type="text" pattern="[0-9]{10}" required>
                </div>

                <div class="field">
                    <label>Subject</label>
                    <input type="text">
                </div>

                <div class="field">
                    <label>Message</label>
                    <textarea rows="6"></textarea>
                </div>

                <button type="submit">Submit</button>
                <button type="reset">Reset</button>


            </form>
        </div>
    </section>
    <footer>
        <hr>
        <a href="../index.html">Back to Home</a>
    </footer>
</body>

</html>
